[platformio]
default_envs = esp32dev, esp32s3

[env]
monitor_speed = 115200
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
lib_ldf_mode = deep+
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++20
lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform.git#feature/profiling-v1
    https://github.com/ESPressio-Development-Platform/EDP-System.git#main

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
