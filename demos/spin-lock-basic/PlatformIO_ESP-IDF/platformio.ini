[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = espidf

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++20


build_flags =
    -std=gnu++20

lib_deps =
    EDP-Platform-ESP-IDF=symlink://../../..
    EDP-Platform=https://github.com/ESPressio-Development-Platform/EDP-Platform.git#main
    EDP-System=https://github.com/ESPressio-Development-Platform/EDP-System.git#main
