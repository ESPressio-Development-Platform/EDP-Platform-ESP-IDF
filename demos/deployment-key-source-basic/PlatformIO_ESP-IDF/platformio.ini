[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = espidf
lib_compat_mode = off

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17

build_flags =
    -std=gnu++20

lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main
    EDP-System=https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    EDP-Platform=https://github.com/ESPressio-Development-Platform/EDP-Platform.git#feature/profiling-v1
    EDP-Memory=https://github.com/ESPressio-Development-Platform/EDP-Memory.git#main
    EDP-BoundedTopology=https://github.com/ESPressio-Development-Platform/EDP-BoundedTopology.git#main
    EDP-Security=https://github.com/ESPressio-Development-Platform/EDP-Security.git#main
