[platformio]
default_envs = esp32dev, esp32s3
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
lib_ldf_mode = off
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
    -std=gnu++20
    -I../../../src
    -I../../../../EDP-Clock/src
    -I../../../../EDP-Platform/src
    -I../../../../EDP-System/src
[env:esp32dev]
board = esp32dev
[env:esp32s3]
board = esp32-s3-devkitc-1
