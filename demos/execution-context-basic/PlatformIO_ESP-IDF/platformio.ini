[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = espidf

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++20


build_flags =
    -std=gnu++20

lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main
    EDP-Platform=https://github.com/ESPressio-Development-Platform/EDP-Platform.git#feature/profiling-v1
    EDP-System=https://github.com/ESPressio-Development-Platform/EDP-System.git#main

[env:esp32s3]
extends = env:esp32dev
board = esp32-s3-devkitc-1
